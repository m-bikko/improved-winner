<!doctype html>
<html lang="__APP_LANG__">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover обязателен, иначе safe-area insets в standalone-режиме равны нулю -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- __APP_NAME__, __APP_SHORT_NAME__, __APP_LANG__ и __APP_DESCRIPTION__
         подставляет плагин из vite.config.ts. Язык здесь один на сборку:
         систему он интересует до запуска приложения, а внутри его переставляет
         LangProvider под того, кто вошёл. -->
    <meta name="apple-mobile-web-app-title" content="__APP_SHORT_NAME__" />
    <meta name="description" content="__APP_DESCRIPTION__" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>__APP_NAME__</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
