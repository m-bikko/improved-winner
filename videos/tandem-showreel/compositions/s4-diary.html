      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const NS = "http://www.w3.org/2000/svg";
          const B = 0.4918;
          const CX = 1370;
          const CY = 540;
          const R = 250;
          const CIRC = 2 * Math.PI * R;
          const GOAL = 2000;

          // Scale an SVG node around a FIXED point by writing its transform attribute.
          // Not GSAP svgOrigin: that needs the node's bbox, and inside a montage this
          // sub-composition is not laid out yet when the timeline is built — every origin
          // came out shifted. Pure numbers, seek-safe.
          const svgT = (sel, cx, cy, s0 = 1) => {
            const node = typeof sel === "string" ? document.querySelector(sel) : sel;
            const p = { sx: s0, sy: s0 };
            const apply = () => node.setAttribute("transform", `translate(${cx} ${cy}) scale(${p.sx.toFixed(4)} ${p.sy.toFixed(4)}) translate(${-cx} ${-cy})`);
            apply();
            return { p, apply };
          };

          // ── Entrances: eyebrow rule draws, headline waterfalls, ring track settles in
          tl.fromTo("#s4-eyebrow-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 0.04);
          tl.fromTo("#s4-eyebrow-text", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.08);
          const words = [];
          [["s4-h1", "Каждый приём"], ["s4-h2", "на двоих"]].forEach(([id, text]) => {
            const host = document.getElementById(id);
            text.split(" ").forEach((w, i, arr) => {
              const s = document.createElement("span");
              s.className = "s4-w";
              s.textContent = w + (i < arr.length - 1 ? " " : "");
              host.appendChild(s);
              words.push(s);
            });
          });
          let at = 0.1;
          let gap = 0.07;
          words.forEach((w, i) => {
            tl.set(w, { opacity: 1 }, at);
            tl.fromTo(w, { y: i === 0 ? 76 : 50 }, { y: 0, duration: i === 0 ? 0.2 : 0.16, ease: "power4.out", immediateRender: false }, at);
            at += gap;
            gap *= 0.84;
          });
          gsap.set(words, { y: 76 });
          const ringT = svgT("#s4-ring-g", CX, CY, 0.86);
          tl.fromTo(ringT.p, { sx: 0.86, sy: 0.86 }, { sx: 1, sy: 1, duration: 0.5, ease: "power3.out", onUpdate: ringT.apply, immediateRender: false }, 0.02);
          tl.fromTo("#s4-ring-g", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 0.02);
          tl.fromTo("#s4-center", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.18);
          tl.fromTo(".s4-row", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.06 }, 0.3);

          // ── Meal segments: one per beat, each a stroke-drawn arc with a 1.2° gap
          const MEALS = [
            { kcal: 420, t: B, pill: "#s4-pill-0" },
            { kcal: 680, t: 2 * B, pill: "#s4-pill-1" },
            { kcal: 380, t: 3 * B, pill: "#s4-pill-2" },
          ];
          const GAP = (1.2 / 360) * CIRC;
          let acc = 0;
          const num = document.getElementById("s4-num");
          const count = { v: 0 };
          const showCount = () => { num.textContent = String(Math.round(count.v)); };
          MEALS.forEach((m, i) => {
            const len = (m.kcal / GOAL) * CIRC;
            const seg = document.createElementNS(NS, "circle");
            seg.setAttribute("cx", String(CX));
            seg.setAttribute("cy", String(CY));
            seg.setAttribute("r", String(R));
            seg.setAttribute("fill", "none");
            seg.setAttribute("stroke", "#e5768c");
            seg.setAttribute("stroke-width", "46");
            seg.setAttribute("stroke-linecap", "butt");
            // dash = [drawn, rest]; offset rotates the dash to start where the last one ended
            const start = acc + (i ? GAP : 0);
            const drawn = len - (i ? GAP : 0);
            seg.setAttribute("stroke-dasharray", `0 ${CIRC}`);
            seg.setAttribute("stroke-dashoffset", String(-start));
            document.getElementById("s4-segs").appendChild(seg);
            const d = { v: 0 };
            tl.fromTo(d, { v: 0 }, {
              v: drawn,
              duration: 0.36,
              ease: "power3.out",
              onUpdate: () => seg.setAttribute("stroke-dasharray", `${d.v.toFixed(2)} ${CIRC}`),
            }, m.t);
            acc += len;
            // the count steps with the segment (same timing, same ease)
            tl.to(count, { v: acc / CIRC * GOAL, duration: 0.36, ease: "power3.out", onUpdate: showCount }, m.t);
            // label pill pops at the segment's midpoint, outside the ring
            const mid = (start + drawn / 2) / CIRC * 2 * Math.PI - Math.PI / 2;
            const px = CX + 382 * Math.cos(mid);
            const py = CY + 382 * Math.sin(mid);
            const pill = document.querySelector(m.pill);
            pill.style.left = `${Math.round(px - 125)}px`;
            pill.style.top = `${Math.round(py - 32)}px`;
            tl.fromTo(pill, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(2)" }, m.t + 0.16);
          });

          // ── Downbeat: the day resolves — remaining pill, ring breath of light
          tl.fromTo("#s4-left-pill", { opacity: 0, y: 26, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 4 * B);
          tl.fromTo("#s4-num", { scale: 1 }, { scale: 1.08, duration: 0.1, ease: "power2.out", immediateRender: false }, 4 * B);
          tl.to("#s4-num", { scale: 1, duration: 0.45, ease: "back.out(2)" }, 4 * B + 0.1);

          // ── Macros fill as ONE chord: same start, same duration, same ease
          const MAC = [[96, 120], [52, 70], [180, 240]];
          const CHORD = 4.5 * B;
          MAC.forEach(([v, goal], i) => {
            tl.fromTo(`#s4-f${i}`, { scaleX: 0 }, { scaleX: v / goal, duration: 0.8, ease: "power3.out" }, CHORD);
            const c = { v: 0 };
            const el = document.getElementById(`s4-v${i}`);
            tl.fromTo(c, { v: 0 }, { v, duration: 0.8, ease: "power3.out", onUpdate: () => { el.textContent = String(Math.round(c.v)); } }, CHORD);
          });

          window.__timelines["s4-diary"] = tl;
        })();
      </script>
