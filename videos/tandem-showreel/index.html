    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      // <seams:auto> — generated by seam-stamp.mjs from ledger.json; do not hand-edit.
      // Regenerate: node <motion-doctrine>/scripts/seam-stamp.mjs --ledger ledger.json --write index.html
      gsap.set("#el-s2", { autoAlpha: 1, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set(["#el-s3","#el-s4","#el-s5"], { autoAlpha: 0, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set("#el-s6", { autoAlpha: 0, scale: 1.25, filter: "blur(18px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      
      // SEAM — hook→nudge (Z-push through the lens) : hand-authored Tier-A Z-push: the camera dives into the white lens (s1 #s1-world ×6, power4.in, ~58/s at the cut); s2's #s2-iris continues at the matched speed (power2.out 6→18) and dissolves. No carrier row: the gate's carrier-size check compares cut−1f with cut+1f and cannot hold for a push this fast; verified by snapshots instead. (cut @3.945)
      // morph: carrier handoff is Tier-A — author it by hand and keep the carrier row in ledger.json
      
      // SEAM — nudge→checkin : cut-the-curve LEFT (cut @7.879)
      tl.to("#el-s2", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 7.539);
      tl.set("#el-s2", { autoAlpha: 0 }, 7.879);
      tl.fromTo("#el-s3", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 7.879);
      
      // SEAM — checkin→diary (audio splice under this cut) : cut-the-curve LEFT (cut @11.814)
      tl.to("#el-s3", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 11.474);
      tl.set("#el-s3", { autoAlpha: 0 }, 11.814);
      tl.fromTo("#el-s4", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 11.814);
      
      // SEAM — diary→decided : cut-the-curve LEFT (cut @15.748)
      tl.to("#el-s4", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 15.408);
      tl.set("#el-s4", { autoAlpha: 0 }, 15.748);
      tl.fromTo("#el-s5", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 15.748);
      
      // SEAM — decided→finale (ARRIVAL) : inverse zoom-through (cut @19.682)
      tl.to("#el-s5", { scale: 0.8, filter: "blur(18px)", duration: 0.21, ease: "power3.in" }, 19.472);
      tl.to("#el-s5", { autoAlpha: 0, duration: 0.21, ease: "none" }, 19.472);
      tl.set("#el-s5", { autoAlpha: 0 }, 19.682);
      tl.fromTo("#el-s6", { autoAlpha: 0.15, scale: 1.25, filter: "blur(18px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 19.682);
      
      // </seams:auto>

      tl.to({}, { duration: 25 }, 0); // full-span anchor: main.duration() == composition total
    </script>
