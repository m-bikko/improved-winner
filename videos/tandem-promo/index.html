<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #141312;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="69"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="7.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-topic-open"
        class="scene"
        data-composition-id="02-topic-open"
        data-composition-src="compositions/frames/02-topic-open.html"
        data-start="7"
        data-duration="7"
        data-track-index="1"
      ></div>

      <div
        id="el-03-topic-closed"
        class="scene"
        data-composition-id="03-topic-closed"
        data-composition-src="compositions/frames/03-topic-closed.html"
        data-start="14"
        data-duration="6.4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-ring"
        class="scene"
        data-composition-id="04-ring"
        data-composition-src="compositions/frames/04-ring.html"
        data-start="20"
        data-duration="10.35"
        data-track-index="1"
      ></div>

      <div
        id="el-05-dish"
        class="scene"
        data-composition-id="05-dish"
        data-composition-src="compositions/frames/05-dish.html"
        data-start="30"
        data-duration="8.35"
        data-track-index="0"
      ></div>

      <div
        id="el-05b-compare"
        class="scene"
        data-composition-id="05b-compare"
        data-composition-src="compositions/frames/05b-compare.html"
        data-start="38"
        data-duration="9.4"
        data-track-index="1"
      ></div>

      <div
        id="el-06-tasks"
        class="scene"
        data-composition-id="06-tasks"
        data-composition-src="compositions/frames/06-tasks.html"
        data-start="47"
        data-duration="7.35"
        data-track-index="0"
      ></div>

      <div
        id="el-07-both"
        class="scene"
        data-composition-id="07-both"
        data-composition-src="compositions/frames/07-both.html"
        data-start="54"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-08-outro"
        class="scene"
        data-composition-id="08-outro"
        data-composition-src="compositions/frames/08-outro.html"
        data-start="59"
        data-duration="10"
        data-track-index="0"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="69"
        data-track-index="11"
        data-volume="0.9"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 7);
        tl.fromTo("#el-02-topic-open", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 7);
        tl.to("#el-03-topic-closed", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 20);
        tl.fromTo("#el-04-ring", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 20);
        tl.to("#el-04-ring", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 30);
        tl.fromTo("#el-05-dish", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 30);
        tl.to("#el-05-dish", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 38);
        tl.fromTo("#el-05b-compare", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 38);
        tl.to("#el-05b-compare", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 47);
        tl.fromTo("#el-06-tasks", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 47);
        tl.to("#el-06-tasks", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 54);
        tl.fromTo("#el-07-both", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 54);
        tl.to("#el-07-both", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 59);
        tl.fromTo("#el-08-outro", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 59);
        tl.to({}, { duration: 69 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
