  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var byId = function (id) {
        return document.getElementById(id);
      };

      /* ── geometry shared with the CSS above ───────────────────────────── */
      var K = 0.45299145; /* screenshot px → canvas px */
      var SCREEN_LEFT = 266 + 9;
      var SCREEN_TOP = 427.51 + 9;
      var CANVAS_W = 1080;
      var CANVAS_H = 1920;

      /* the norm block inside the plate, in screenshot px */
      var BLOCK_TOP_SS = 422.5; /* ring outer top */
      var BLOCK_BOT_SS = 1173; /* macro track bottom */
      var RING_CX_SS = 585;

      /* the same block in canvas px at scale 1 */
      var blockCx = SCREEN_LEFT + RING_CX_SS * K; /* ≈ 540 — already centred */
      var blockCy = SCREEN_TOP + ((BLOCK_TOP_SS + BLOCK_BOT_SS) / 2) * K; /* ≈ 798 */

      /* coordinate-target-zoom, nested-wrapper form: T = -offset.
         The vertical counter-translate is biased 62px past the exact
         block-centring value so the phone's top edge clears the frame at
         peak zoom (a 2.4× close-up of a plate that tall would otherwise
         leave a black band above it). */
      var ZOOM = 2.4;
      var TX = -(blockCx - CANVAS_W / 2); /* ≈ 0 */
      var TY = -(blockCy - CANVAS_H / 2) - 62; /* ≈ 100 */

      /* ── ring ─────────────────────────────────────────────────────────── */
      var arc = byId("f04-ring-arc");
      var LEN = (arc.getTotalLength && arc.getTotalLength()) || 521.36;
      arc.style.strokeDasharray = LEN;
      arc.style.strokeDashoffset = LEN * (1 - 0.19);

      /* Counters are DIRECT innerText tweens (counting-dynamic-scale,
         "no proxy" variation) rather than onUpdate proxies: GSAP writes the
         property on every render, so the digits are correct on any seek path,
         including the ones that seek with suppressEvents. Each counted number
         lives in its own span so the surrounding copy stays verbatim. */
      var COUNT_AT = 2.2;
      var COUNT_DUR = 3.0;
      var COUNT_EASE = "power1.inOut";
      var SNAP = { innerText: 1 };

      /* percent 19 → 89 */
      tl.to(
        "#f04-ring-num",
        { innerText: 89, snap: SNAP, duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_AT
      );
      /* «504 / 2674 ккал» → «2368 / 2674 ккал» */
      tl.to(
        "#f04-ring-kcalnum",
        { innerText: 2368, snap: SNAP, duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_AT
      );
      /* «Осталось 2170 ккал» → «Осталось 306 ккал» (2674 − eaten) */
      tl.to(
        "#f04-ring-restnum",
        { innerText: 306, snap: SNAP, duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_AT
      );

      /* ── Scene 1 (0.0–1.4) — the screen is read. Nothing moves. ───────── */

      /* ── Scene 2 (1.4–2.2) — framing rises to the norm block ──────────── */
      tl.to("#f04-ring-cam-outer", { scale: ZOOM, duration: 0.9, ease: "power3.inOut" }, 1.35);
      tl.to("#f04-ring-cam-inner", { x: TX, y: TY, duration: 0.9, ease: "power3.inOut" }, 1.35);

      /* ── Scene 3 (2.2–5.2) — the signature beat.
         Arc, percent, kcal and the remainder move as ONE: same position,
         same duration, same ease, so number and arc land as one beat. */
      tl.to(
        arc,
        { strokeDashoffset: LEN * (1 - 0.89), duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_AT
      );
      /* counting-dynamic-scale: the lockup gains weight on the same ease and
         lands at the screen's true type size (scale 1). */
      tl.fromTo(
        "#f04-ring-numwrap",
        { scale: 0.88 },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_AT
      );

      /* ── Scene 4 — the macro bars, riding WITH the ring ────────────────
         Originally these ran as a separate beat at 5.3s, after the ring had
         finished. The contact sheet killed that: at t=25s the screen read
         "2351 / 2674 ккал" beside "Б 17 / 133" — 2351 kcal with 17 g of
         protein is not a thing, and this video is aimed at people who read
         macros. A number that stays visibly stale while its own total climbs
         reads as a bug in the app, not as pacing.

         So the bars now start just after the ring (2.6s) and land with it
         (~5.0–5.36s vs the ring's 5.2s). The stagger survives as texture;
         the day fills up as ONE event, which is also what actually happens.

         They also start from the 19% state, not from zero: the screenshot
         underneath shows breakfast already logged, and a bar collapsing to
         zero contradicts the plate it sits on. */
      var macros = [
        { bar: "#f04-ring-bar1", val: "#f04-ring-mv1n", from: 17, to: 132, goal: 133 },
        { bar: "#f04-ring-bar2", val: "#f04-ring-mv2n", from: 11, to: 54, goal: 67 },
        { bar: "#f04-ring-bar3", val: "#f04-ring-mv3n", from: 87, to: 339, goal: 385 },
      ];
      var BAR_AT = 2.6;
      var BAR_DUR = 2.4;
      var BAR_STAGGER = 0.18;
      var BAR_EASE = "power1.inOut";

      macros.forEach(function (m, i) {
        var at = BAR_AT + i * BAR_STAGGER;
        tl.fromTo(
          m.bar,
          { scaleX: m.from / m.goal },
          { scaleX: m.to / m.goal, duration: BAR_DUR, ease: BAR_EASE },
          at
        );
        tl.to(
          m.val,
          { innerText: m.to, snap: SNAP, duration: BAR_DUR, ease: BAR_EASE },
          at
        );
      });

      /* ── Scene 5 (6.6–8.0) — the title stands up in the bottom band ───── */
      tl.to("#f04-ring-scrim", { opacity: 1, duration: 0.55, ease: "power2.out" }, 6.6);
      tl.fromTo(
        "#f04-ring-accentline",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" },
        6.72
      );
      tl.fromTo(
        "#f04-ring-tl1",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        6.86
      );
      tl.fromTo(
        "#f04-ring-tl2",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        7.04
      );

      /* ── Scene 6 (8.0–10.0) — framing releases back to the wide pose.
         Handoff to frame 05: plate centred at x 540 / y 1010, scale 1. */
      tl.to("#f04-ring-cam-outer", { scale: 1, duration: 1.3, ease: "power2.inOut" }, 8.0);
      tl.to("#f04-ring-cam-inner", { x: 0, y: 0, duration: 1.3, ease: "power2.inOut" }, 8.0);

      window.__timelines["04-ring"] = tl;
    })();
