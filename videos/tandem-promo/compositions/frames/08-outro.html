      window.__timelines = window.__timelines || {};

      /* ────────────────────────────────────────────────────────────────
         coordinate-target-zoom — baked from the authored layout.
         The Тандем tile is a 100×100 box at left 428 / top 860, so its
         centre sits at (478, 910) on the 1080×1920 canvas.
           offset      = (478 - 540, 910 - 960) = (-62, -50)
           ZOOM_SCALE  = 340 / 100 = 3.4   (mark ≈ 31.5% of the canvas)
           landing     = (0, -160) from centre → mark centre at (540, 800)
           T           = landing / S - offset = (62, 2.94)
         Outer scales, inner counter-translates; both share position,
         duration and ease.
         ──────────────────────────────────────────────────────────────── */
      var ZOOM_SCALE = 3.4;
      var ZOOM_AT = 6.25;
      var ZOOM_DUR = 1.15;
      var COUNTER_X = 62;
      var COUNTER_Y = 2.94;

      /* ── Scene 1 (0.0-1.4) - the two phones come back together as one
             -> scale-swap-transition (outgoing power2.in, incoming back.out).
             Every start state is declared with fromTo (or in CSS), so frame 0
             renders correctly and every seek replays cleanly. */
      tl.fromTo("#outro-half-l", { x: 0 }, { x: 198, duration: 0.45, ease: "power2.in" }, 0.35);
      tl.fromTo("#outro-half-r", { x: 0 }, { x: -198, duration: 0.45, ease: "power2.in" }, 0.35);
      tl.fromTo(
        "#outro-pair",
        { opacity: 1, scale: 1 },
        { opacity: 0, scale: 0.78, duration: 0.45, ease: "power2.in" },
        0.35
      );
      tl.fromTo(
        "#outro-phone",
        { opacity: 0, scale: 0.78 },
        { opacity: 1, scale: 1, duration: 0.62, ease: "back.out(1.2)" },
        0.65
      );

      /* -- Scene 2 (1.4-2.6) - the screen drops to the home screen ------ */

        "#outro-glow-one",
        { opacity: 1 },
        { opacity: 0, duration: 0.5, ease: "power2.inOut" },
        1.45
      );
      tl.fromTo(
        "#outro-stage",
        { y: 260 },
        { y: 0, duration: 0.72, ease: "power2.inOut" },
        1.5
      );
      tl.fromTo(
        "#outro-wall",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power2.out" },
        1.78
      );
      tl.fromTo(
        "#outro-grid",
        { opacity: 0 },
        { opacity: 1, duration: 0.01, ease: "none" },
        1.95
      );
      tl.fromTo(
        ".outro-tile",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out", stagger: 0.018 },
        1.96
      );
      tl.fromTo(
        ["#outro-statusbar", "#outro-dock", "#outro-dots", "#outro-home-bar"],
        { opacity: 0 },
        { opacity: 1, duration: 0.42, ease: "power2.out", stagger: 0.06 },
        2.12
      );

      /* -- Scene 3 (2.6-3.8) - the icon settles into the empty slot.
            Long-tailed ease, no spring: installing an app is a calm fact. */
      tl.fromTo(
        "#outro-icon",
        { opacity: 0, scale: 0.62 },
        { opacity: 1, scale: 1, duration: 1.05, ease: "power4.out" },
        2.7
      );

      /* -- Scene 4 (3.8-4.8) - the label appears a beat later, at the size
            and colour it will actually have on a phone ------------------- */
      tl.fromTo(
        "#outro-icon-label",
        { opacity: 0, y: 5 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        3.9
      );

      /* -- Scene 5 (4.8-6.0) - first title, bottom band ----------------- */
      tl.fromTo(
        ".outro-t1-line",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.75, ease: "power3.out", stagger: 0.13 },
        4.85
      );

      /* -- Scene 6 (6.0-7.4) - everything but the mark leaves; the mark is
            zoomed to the centre of the frame ---------------------------- */
      tl.to(".outro-t1-line", { opacity: 0, duration: 0.4, ease: "power2.in" }, 6.02);
      tl.to("#outro-icon-label", { opacity: 0, duration: 0.4, ease: "power2.in" }, 6.02);
      tl.to("#outro-phone", { opacity: 0, duration: 0.55, ease: "power2.inOut" }, 6.05);
      tl.fromTo(
        "#outro-zoom-outer",
        { scale: 1 },
        { scale: ZOOM_SCALE, duration: ZOOM_DUR, ease: "power3.inOut" },
        ZOOM_AT
      );
      tl.fromTo(
        "#outro-zoom-inner",
        { x: 0, y: 0 },
        { x: COUNTER_X, y: COUNTER_Y, duration: ZOOM_DUR, ease: "power3.inOut" },
        ZOOM_AT
      );

      /* -- Scene 7 (7.4-8.4) - the closing title stands up under the mark */
      tl.fromTo(
        ".outro-t2-mark",
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        7.5
      );
      tl.fromTo(
        ".outro-t2-tag",
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        7.64
      );

      /* -- Scene 8 (8.4-10.0) - dead still. Nothing moves, at all.
            The composition holds this exact frame to the end. ----------- */
      tl.to("#outro-bg", { opacity: 1, duration: 0.01, ease: "none" }, 9.99);

      window.__timelines["08-outro"] = tl;
