  <script>
    (function () {
      var el = function (id) {
        return document.getElementById(id);
      };

      /* ============================================================
         camera — panel-edit-live-sync law: the couple stays co-visible.
         A: handoff framing (plate centre 540/1010, scale 1.0)
         B: push-in on the состав block, totals still in frame
         C: «Готовый вес» + «На 100 г готового блюда» framed together
            and never separated again.
         ============================================================ */
      var camOuter = el("f05-dish-cam-outer");
      var camInner = el("f05-dish-cam-inner");
      var PH_A = { s: 1, y: 0 };
      var PH_B = { s: 1.4, y: -173.05 };
      var PH_C = { s: 1.9, y: -288.99 };

      /* ============================================================
         content — the two ingredient rows, rebuilt live over the shot
         ============================================================ */
      var ITEMS = [
        { name: "Куриная грудка", kcal: "113 ккал на 100 г", value: "500", unit: "г", top: 691 },
        { name: "Рис белый сухой", kcal: "344 ккал на 100 г", value: "200", unit: "г", top: 907 },
      ];

      var TRASH =
        '<svg class="d05-dish-ing-trash" width="40" height="44" viewBox="0 0 40 44" fill="none" ' +
        'stroke="#88827a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M4 9 H36"/><path d="M15 9 V4.5 H25 V9"/>' +
        '<path d="M8 9 L10 39 Q10.4 41.5 13 41.5 H27 Q29.6 41.5 30 39 L32 9"/>' +
        '<path d="M17 17 V33 M23 17 V33"/></svg>';

      /* dynamic-content-sequencing — start times reduced once, at build time,
         from each row's own content length. Never recomputed per frame. */
      var SEQ_START = 1.25;
      var ITEM_BASE = 0.42;
      var SEC_PER_CHAR = 0.014;
      var REVEAL_DUR = 0.62;

      var cumulative = SEQ_START;
      var ROWS = ITEMS.map(function (it) {
        var start = cumulative;
        cumulative += ITEM_BASE + it.name.length * SEC_PER_CHAR;
        return { item: it, start: start };
      });

      var rowsHost = el("f05-dish-rows");
      var rowEls = ROWS.map(function (r) {
        var d = document.createElement("div");
        d.className = "d05-dish-ing";
        d.style.top = r.item.top + "px";
        d.innerHTML =
          '<div class="d05-dish-ing-name">' +
          r.item.name +
          "</div>" +
          '<div class="d05-dish-ing-kcal">' +
          r.item.kcal +
          "</div>" +
          '<div class="d05-dish-ing-box"></div>' +
          '<div class="d05-dish-ing-val">' +
          r.item.value +
          "</div>" +
          '<div class="d05-dish-ing-unit">' +
          r.item.unit +
          "</div>" +
          TRASH;
        rowsHost.appendChild(d);
        return d;
      });

      /* ============================================================
         the signature beat — discrete-text-sequence on the control,
         counting-dynamic-scale on the bound surface, ONE shared cue.
         ============================================================ */
      var SYNC_AT = 3.4;

      var TYPE_DUR = 1.0;
      var SEQUENCE = [
        { t: 0.0, text: "" },
        { t: 0.12, text: "1" },
        { t: 0.28, text: "10" },
        { t: 0.43, text: "100" },
        { t: 0.6, text: "1000" },
      ];
      function textAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }
      var typedEl = el("f05-dish-typed");
      var caretEl = el("f05-dish-caret");

      var kcalEl = el("f05-dish-kcal");
      var mbEl = el("f05-dish-mb");
      var mfEl = el("f05-dish-mf");
      var mcEl = el("f05-dish-mc");

      var COUNT_DUR = 1.55;
      var COUNT_EASE = "power3.out";
      function one(v) {
        return v < 0.05 ? "0" : v.toFixed(1);
      }

      var sKcal = { v: 0 };
      var sB = { v: 0 };
      var sF = { v: 0 };
      var sC = { v: 0 };

      /* ============================================================
         timeline
         ============================================================ */
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0–1.2s) — the cut lands the plate exactly where frame 04
         left it; состав is empty, the totals read zero. */

      /* Scene 2 (1.2–2.6s) — the rows arrive, one at a time, top to bottom,
         while the camera eases into the состав block. */
      tl.fromTo(
        camOuter,
        { scale: PH_A.s },
        { scale: PH_B.s, duration: 0.9, ease: "power2.inOut" },
        1.15,
      );
      tl.fromTo(camInner, { y: PH_A.y }, { y: PH_B.y, duration: 0.9, ease: "power2.inOut" }, 1.15);

      rowEls.forEach(function (node, i) {
        tl.fromTo(
          node,
          { opacity: 0, y: 34, scale: 0.97 },
          { opacity: 1, y: 0, scale: 1, duration: REVEAL_DUR, ease: "power3.out" },
          ROWS[i].start,
        );
      });

      /* Scene 3 (2.6–3.4s) — reframe so the control and its bound surface
         share the frame for the rest of the shot; the binding is declared. */
      tl.to(camOuter, { scale: PH_C.s, duration: 0.85, ease: "power2.inOut" }, 2.6);
      tl.to(camInner, { y: PH_C.y, duration: 0.85, ease: "power2.inOut" }, 2.6);

      tl.fromTo(
        el("f05-dish-field-ring"),
        { opacity: 0, scale: 1.04 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" },
        3.0,
      );
      tl.fromTo(
        el("f05-dish-link"),
        { opacity: 0, scaleY: 0 },
        { opacity: 1, scaleY: 1, duration: 0.45, ease: "power2.out" },
        3.05,
      );
      tl.fromTo(
        el("f05-dish-panel-ring"),
        { opacity: 0, scale: 1.04 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" },
        3.15,
      );

      /* Scene 4 (3.4–5.4s) — THE BEAT. Both tweens open at SYNC_AT: the field
         types to 1000 and the panel recomputes in the same take, no pause. */
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: TYPE_DUR,
          duration: TYPE_DUR,
          ease: "none",
          onUpdate: function () {
            typedEl.textContent = textAt(driver.t);
          },
        },
        SYNC_AT,
      );

      var blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * 1.75,
          duration: TYPE_DUR,
          ease: "none",
          onUpdate: function () {
            caretEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        SYNC_AT,
      );
      tl.to(caretEl, { opacity: 1, duration: 0.01 }, SYNC_AT + TYPE_DUR + 0.02);

      tl.to(
        sKcal,
        {
          v: 125,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            kcalEl.textContent = String(Math.round(sKcal.v));
          },
        },
        SYNC_AT,
      );
      tl.fromTo(
        kcalEl,
        { scale: 0.72 },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE },
        SYNC_AT,
      );
      tl.to(
        sB,
        {
          v: 13.1,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            mbEl.textContent = one(sB.v);
          },
        },
        SYNC_AT,
      );
      tl.to(
        sF,
        {
          v: 1.1,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            mfEl.textContent = one(sF.v);
          },
        },
        SYNC_AT,
      );
      tl.to(
        sC,
        {
          v: 16,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            mcEl.textContent = String(Math.round(sC.v));
          },
        },
        SYNC_AT,
      );

      /* Scene 5 (5.4–6.6s) — the title lands in the reserved bottom band. */
      tl.fromTo(
        el("f05-dish-rule"),
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" },
        5.4,
      );
      var words = Array.prototype.slice.call(
        el("f05-dish-title").getElementsByClassName("d05-dish-w"),
      );
      tl.fromTo(
        words,
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.55, stagger: 0.045, ease: "power3.out" },
        5.5,
      );

      /* Scene 6 (6.6–8.0s) — held. Nothing moves. */

      window.__timelines["05-dish"] = tl;
    })();
  </script>
