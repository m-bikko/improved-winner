  <script>
    (function () {
      var byId = function (id) {
        return document.getElementById("tc3-" + id);
      };

      var sheet = byId("sheet");
      var below = byId("below");
      var resLines = byId("res-lines");
      var resMeta = byId("res-meta");
      var headOpen = byId("head-open");
      var btnOpen = byId("btn-open");
      var rule = byId("rule");
      var title = byId("title");

      // Высота тела блока в пикселях снимка — совпадает с CSS-высотой
      // окна роста. Расхождение = щель или нахлёст на полном открытии.
      var BODY_H = 414;
      var TOTAL = 6;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ——— Scene 2 (0.9–2.4s) — anchored-layout-expand ———————————
      // ОДИН fromTo ведёт лист И ленту: нижняя кромка блока и лента
      // остаются в точном контакте по построению.
      tl.fromTo(
        [sheet, below],
        { y: -BODY_H },
        { y: 0, duration: 0.55, ease: "power3.out" },
        0.95
      );

      // ——— Scene 3 (2.4–3.6s) — текст решения отдельным тактом ———
      tl.fromTo(
        resLines,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        2.45
      );
      tl.fromTo(
        resMeta,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        2.8
      );

      // ——— Scene 4 (3.6–4.4s) — discrete-text-sequence ——————————
      // «Обсуждение» → «Закрыто» резкой подменой состояния, без
      // растворения. Вместе со статусом меняется нижняя кнопка.
      var STATES = [
        { t: 0.0, open: 1 },
        { t: 3.75, open: 0 }
      ];
      function stateAt(time) {
        for (var i = STATES.length - 1; i >= 0; i--) {
          if (time >= STATES[i].t) return STATES[i].open;
        }
        return 1;
      }
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: TOTAL,
          duration: TOTAL,
          ease: "none",
          onUpdate: function () {
            var o = stateAt(driver.t) ? "1" : "0";
            headOpen.style.opacity = o;
            btnOpen.style.opacity = o;
          }
        },
        0
      );

      // ——— Scene 5 (4.4–6.0s) — титр встаёт и кадр держится ————
      tl.fromTo(
        rule,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out", transformOrigin: "50% 50%" },
        4.45
      );
      tl.fromTo(
        title,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        4.55
      );

      window.__timelines["03-topic-closed"] = tl;
    })();
  </script>
