  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var phoneL = document.getElementById("f07-both-phone-left");
      var phoneR = document.getElementById("f07-both-phone-right");
      var phones = [phoneL, phoneR];
      // DOM order is left, then right - one nodelist, so the pair can never
      // drift apart in time.
      var notifs = Array.prototype.slice.call(
        document.querySelectorAll(".f07-both-notif")
      );

      var SPREAD = 190; // half the distance between the settled centres
      var RISE = -220; // keeps the pair's top edge on the single plate's top
      var SETTLE = 0.62; // the landed scale
      var TILT = 14; // book-open angle
      var TILT_OVER = 18; // pivot-into-place overshoot

      // Scene 5 - the whole reason this frame exists. ONE start time,
      // ONE tween, both plates. Zero delay, by construction.
      var NOTIF_AT = 3.0;

      /* Scene 1 (0.0–0.6s) - the cut handed us a single plate at
         x 540 / y 1010, scale 1, opacity 1. Nothing is scheduled here:
         the frame is deliberately motionless. */

      /* Scene 2 (0.6–1.8s) - signature move: split-tilt-cards.
         One plate becomes two; mirrored rotateY opens them like a book. */
      tl.fromTo(
        phones,
        { x: 0, y: 0, scale: 1 },
        {
          x: function (i) {
            return i === 0 ? -SPREAD : SPREAD;
          },
          y: RISE,
          scale: SETTLE,
          duration: 1.05,
          ease: "power3.out",
        },
        0.6
      );

      // mirrored tilt - opposite signs, or the symmetry collapses
      tl.fromTo(
        phones,
        { rotationY: 0 },
        {
          rotationY: function (i) {
            return i === 0 ? TILT_OVER : -TILT_OVER;
          },
          duration: 0.85,
          ease: "power2.out",
        },
        0.6
      );
      tl.fromTo(
        phones,
        {
          rotationY: function (i) {
            return i === 0 ? TILT_OVER : -TILT_OVER;
          },
        },
        {
          rotationY: function (i) {
            return i === 0 ? TILT : -TILT;
          },
          duration: 0.35,
          ease: "power2.inOut",
          immediateRender: false,
        },
        1.45
      );

      /* Scene 3 (1.8–2.4s) - the title stands up in the bottom band,
         early and on its own, so the key moment isn't shared with reading. */
      tl.fromTo(
        "#f07-both-rule",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.8
      );
      tl.fromTo(
        "#f07-both-title",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        1.86
      );

      /* Scene 4 (2.4–3.0s) - the tilt flattens to zero. The 3D served the
         split; by the notification both plates are frontal. */
      tl.fromTo(
        phones,
        {
          rotationY: function (i) {
            return i === 0 ? TILT : -TILT;
          },
        },
        { rotationY: 0, duration: 0.6, ease: "power2.inOut", immediateRender: false },
        2.4
      );

      /* Scene 5 (3.0–3.6s) - THE key moment. Both banners drop in from the
         top of their screen with one short spring overshoot. Same tween,
         same start, same duration, same ease, no stagger. */
      tl.fromTo(
        notifs,
        { y: -190, scale: 0.94 },
        { y: 0, scale: 1, duration: 0.62, ease: "back.out(1.2)" },
        NOTIF_AT
      );
      tl.fromTo(
        notifs,
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power1.out" },
        NOTIF_AT
      );

      /* Scene 6 (3.6–5.0s) - held. Two phones, two identical banners,
         the title. Nothing moves. */

      window.__timelines["07-both"] = tl;
