          // ── The drum: six states on the off-beats, hard and rhythmic; the last one holds
          const T = [0.25, 0.74, 1.23, 1.72, 2.21, 2.7];
          const TONE = ["#f28ca2", "#aab3bf", "#80cf99", "#e5768c", "#6fd1cb", "#84b9ef"];
          const DOT = "#4a433c";
          // One strip: the outgoing and incoming panels move together, one card-height apart,
          // so they never overlap — the window (overflow hidden) shows a hard slot-slide up.
          const TRAVEL = 640;
          const SLIDE = 0.26;
          T.forEach((t, i) => {
            const p = `#s10-p${i}`;
            // in: from below the window, snaps home — the change lands mid-slide, on the mark
            tl.set(p, { opacity: 1 }, t - 0.12);
            tl.fromTo(p, { y: TRAVEL }, { y: 0, duration: SLIDE, ease: "power4.inOut", immediateRender: false }, t - 0.12);
            tl.fromTo(`${p} .s10-tile`, { scale: 0.7 }, { scale: 1, duration: 0.4, ease: "back.out(2.2)", immediateRender: false }, t - 0.02);
            tl.fromTo(`#s10-glow-${i}`, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, t - 0.06);
            tl.fromTo(`#s10-d${i}`, { backgroundColor: DOT, scale: 1 }, { backgroundColor: TONE[i], scale: 1.5, duration: 0.2, ease: "power3.out", immediateRender: false }, t - 0.02);
            if (i < T.length - 1) {
              const n = T[i + 1];
              // out: up through the top of the window, in lockstep with the next one
              tl.fromTo(p, { y: 0 }, { y: -TRAVEL, duration: SLIDE, ease: "power4.inOut", immediateRender: false }, n - 0.12);
              tl.set(p, { opacity: 0 }, n + 0.15);
              tl.fromTo(`#s10-glow-${i}`, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, n - 0.06);
              tl.fromTo(`#s10-d${i}`, { backgroundColor: TONE[i], scale: 1.5 }, { backgroundColor: DOT, scale: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, n - 0.02);
            }
          });
          gsap.set(".s10-panel", { y: TRAVEL });
          gsap.set(".s10-tile", { scale: 0.7 });

          // ── The last state answers: the plane nudges out and back, a notification dot lands
          tl.fromTo("#s10-send", { x: 0, y: 0 }, { x: 14, y: -14, duration: 0.12, ease: "power2.out", immediateRender: false }, 2.95);
          tl.fromTo("#s10-send", { x: 14, y: -14 }, { x: 0, y: 0, duration: 0.34, ease: "back.out(2.2)", immediateRender: false }, 3.08);
          tl.fromTo("#s10-badge", { scale: 0 }, { scale: 1, duration: 0.34, ease: "back.out(2.6)", immediateRender: false }, 2.98);
          gsap.set("#s10-badge", { scale: 0 });
          // from 3.2: a still hold on the finished state; the root owns the inverse-zoom exit

          window.__timelines["s10-more"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
