          const num = document.getElementById("s3-num");
          const cnt = { v: 0 };
          tl.fromTo(cnt, { v: 0 }, { v: 46, duration: 1.3, ease: "power2.out", onUpdate: () => { num.textContent = String(Math.round(cnt.v)); } }, 0.3);
          tl.fromTo(num, { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.3, ease: "power2.out" }, 0.3);
          tl.fromTo("#s3-num-a", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.62);
          tl.fromTo("#s3-num-b", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.78);

          // ── Chip wall: one cascade, row by row, capped at ~0.5s total
          const chips = [...document.querySelectorAll(".s3-chip")].sort((a, b) => a.dataset.order - b.dataset.order);
          chips.forEach((c, i) => {
            const t = 0.16 + i * 0.028;
            tl.set(c, { opacity: 1 }, t);
            tl.fromTo(c, { y: 44 }, { y: 0, duration: 0.2, ease: "power4.out", immediateRender: false }, t);
          });
          gsap.set(chips, { y: 44 });

          // ── Two ring-cursors take turns on the beats (multi-cursor choreography).
          // Chip boxes are authored constants (s3 layout), not measured — montage-safe.
          const BOX = {
            6: [433, 1160, 196], 10: [400, 960, 218], 2: [140, 1160, 279],
            1: [133, 960, 253], 12: [643, 1160, 325], 3: [106, 1260, 286],
          };
          // the cursor lands on the chip's top-right corner and leaves a badge there
          const corner = (id) => [BOX[id][0] + BOX[id][2] - 14, BOX[id][1] + 12];
          const PICKS = [
            { who: "me", id: 6, t: 2.5 * B },
            { who: "you", id: 1, t: 3.0 * B },
            { who: "me", id: 10, t: 3.5 * B },
            { who: "you", id: 12, t: 4.0 * B },
            { who: "me", id: 2, t: 4.5 * B },
            { who: "you", id: 3, t: 5.0 * B },
          ];
          const TONE = {
            me: { bg: "#3a1f27", ring: "#f28ca2", ink: "#fbd3dc" },
            you: { bg: "#1a2a3c", ring: "#84b9ef", ink: "#d3e6fa" },
          };
          const cur = { me: { x: 60, y: 1640 }, you: { x: 1030, y: 760 } };
          const curEl = { me: document.getElementById("s3-cur-me"), you: document.getElementById("s3-cur-you") };
          const draw = (who) => () => {
            curEl[who].setAttribute("cx", cur[who].x.toFixed(2));
            curEl[who].setAttribute("cy", cur[who].y.toFixed(2));
          };
          ["me", "you"].forEach((w) => draw(w)());
          tl.fromTo("#s3-cur-me-g", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0.5);
          tl.fromTo("#s3-cur-you-g", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0.7);

          PICKS.forEach((p) => {
            const [cx, cy] = corner(p.id);
            const travel = 0.36;
            // travel: the cursor arrives just before the beat, the click lands ON it
            tl.to(cur[p.who], { x: cx, y: cy, duration: travel, ease: "power3.inOut", onUpdate: draw(p.who) }, p.t - travel);
            // press = the ring squeezes (its radius), so it never depends on a bbox origin
            tl.fromTo(curEl[p.who], { attr: { r: 30 } }, { attr: { r: 21 }, duration: 0.07, ease: "power2.in", immediateRender: false }, p.t - 0.04);
            tl.to(curEl[p.who], { attr: { r: 30 }, duration: 0.36, ease: "back.out(2.4)" }, p.t + 0.03);
            // the chip reacts on the click frame: squash, fill in the person's tone, spring back
            const chip = document.getElementById(`s3-chip-${p.id}`);
            const tone = TONE[p.who];
            tl.to(chip, { scale: 0.93, duration: 0.07, ease: "power2.in" }, p.t - 0.04);
            tl.to(chip, { scale: 1, duration: 0.42, ease: "back.out(2.2)" }, p.t + 0.03);
            tl.to(chip, { backgroundColor: tone.bg, color: tone.ink, boxShadow: `inset 0 0 0 3px ${tone.ring}`, duration: 0.18, ease: "power2.out" }, p.t);
            // badge left behind in the corner
            const b = document.createElementNS(NS, "circle");
            b.setAttribute("cx", String(cx));
            b.setAttribute("cy", String(cy));
            b.setAttribute("r", "0");
            b.setAttribute("fill", tone.ring);
            b.setAttribute("stroke", "#121110");
            b.setAttribute("stroke-width", "5");
            document.getElementById("s3-badges").appendChild(b);
            tl.fromTo(b, { attr: { r: 0 } }, { attr: { r: 13 }, duration: 0.4, ease: "back.out(2.6)", immediateRender: false }, p.t + 0.02);
          });

          // Staged payoff on the next beat: the wall resolves into what the two of you feel
          // today — everything unpicked recedes, the six picks stay lit
          const picked = new Set(PICKS.map((p) => `s3-chip-${p.id}`));
          const rest = chips.filter((c) => !picked.has(c.id));
          tl.to(rest, { opacity: 0.28, duration: 0.45, ease: "power2.out" }, 6 * B);
          PICKS.forEach((p, i) => {
            tl.to(`#s3-chip-${p.id}`, { scale: 1.06, duration: 0.14, ease: "power2.out" }, 6 * B + i * 0.03);
            tl.to(`#s3-chip-${p.id}`, { scale: 1, duration: 0.4, ease: "back.out(2)" }, 6 * B + 0.14 + i * 0.03);
          });

          // after the last pick the cursors drift out of the way toward the exit direction
          tl.to(cur.me, { x: 160, y: 1480, duration: 0.6, ease: "power2.inOut", onUpdate: draw("me") }, 5.0 * B + 0.1);
          tl.to(cur.you, { x: 960, y: 800, duration: 0.6, ease: "power2.inOut", onUpdate: draw("you") }, 5.0 * B + 0.3);

          window.__timelines["s03-checkin"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
