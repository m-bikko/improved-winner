  lens (Z-push) and the cut lands mid-push on the drop — the lens is the carrier into s2.
  Rules: svg-path-draw (ring field), spring-pop-entrance (lock, lens), waterfall-entry

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const C = { x: 540, y: 820 };
          const LOCK_HALF = 125; // center distance 250 = 1.667 × r, the app mark's proportion
          const T_LOCK = 2.46;

          // Scale an SVG node around a FIXED point by writing its transform attribute.
          // Not GSAP svgOrigin: that needs the node's bbox, and inside a montage this
          // sub-composition is not laid out yet when the timeline is built — every origin
          // came out shifted. Pure numbers, seek-safe.
          const svgT = (sel, cx, cy, s0 = 1) => {
            const node = typeof sel === "string" ? document.querySelector(sel) : sel;
            const p = { sx: s0, sy: s0 };
            const apply = () => node.setAttribute("transform", `translate(${cx} ${cy}) scale(${p.sx.toFixed(4)} ${p.sy.toFixed(4)}) translate(${-cx} ${-cy})`);
            apply();
            return { p, apply };
          };

          // ── Ring field: stroke-draw outward (svg-path-draw; length = 2πr, no DOM measurement)
          const field = document.querySelectorAll("#s1-field circle");
          field.forEach((c, i) => {
            const len = 2 * Math.PI * Number(c.getAttribute("r"));
            gsap.set(c, { strokeDasharray: len, strokeDashoffset: len, strokeOpacity: 0.1 });
            tl.to(c, { strokeDashoffset: 0, duration: 1.1, ease: "power2.out" }, 0.02 + i * 0.09);
          });

          // ── The rings' path as a pure function of time (seek-safe: onUpdate reads proxies only)
          const bez = (p0, p1, p2, p3, t) => {
            const u = 1 - t;
            return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3;
          };
          // Phase A endpoints: each ring arrives at its orbit start moving tangentially
          // («я» at θ=π moving up, «ты» at θ=0 moving down — the orbit's clockwise tangent)
          const A_ME = [[-280, 2080], [60, 1480], [260, 1020], [260, 820]];
          const A_YOU = [[1360, -300], [1080, 200], [820, 620], [820, 820]];
          const st = { a: 0, b: 0, sep: 0 };
          const me = document.getElementById("s1-ring-me");
          const you = document.getElementById("s1-ring-you");

          // ghosts: 3 lagged copies per ring
          const NS = "http://www.w3.org/2000/svg";
          const ghostHost = document.getElementById("s1-ghosts");
          const ghosts = [];
          [["#f28ca2", 0], ["#84b9ef", 1]].forEach(([color, who]) => {
            for (let k = 1; k <= 3; k++) {
              const g = document.createElementNS(NS, "circle");
              g.setAttribute("r", "150");
              g.setAttribute("fill", "none");
              g.setAttribute("stroke", color);
              g.setAttribute("stroke-width", String(68 - k * 14));
              g.setAttribute("stroke-opacity", String(0.3 - k * 0.08));
              ghostHost.appendChild(g);
              ghosts.push({ el: g, who, lag: k });
            }
          });

          function posAt(a, b, who) {
            if (b <= 0) {
              const P = who === 0 ? A_ME : A_YOU;
              return [bez(P[0][0], P[1][0], P[2][0], P[3][0], a), bez(P[0][1], P[1][1], P[2][1], P[3][1], a)];
            }
            const theta = Math.PI + 2 * Math.PI * b + (who === 0 ? 0 : Math.PI);
            const R = 280 - (280 - LOCK_HALF) * b;
            return [C.x + R * Math.cos(theta), C.y + R * Math.sin(theta)];
          }
          function render() {
            const [mx, my] = posAt(st.a, st.b, 0);
            const [yx, yy] = posAt(st.a, st.b, 1);
            me.setAttribute("cx", (mx - st.sep).toFixed(2));
            me.setAttribute("cy", my.toFixed(2));
            you.setAttribute("cx", (yx + st.sep).toFixed(2));
            you.setAttribute("cy", yy.toFixed(2));
            ghosts.forEach((g) => {
              // lag in path-space: step back along whichever phase is active
              const la = Math.max(0, st.a - g.lag * 0.045);
              const lb = st.b > 0 ? Math.max(0, st.b - g.lag * 0.035) : 0;
              const [gx, gy] = posAt(st.b > 0 && lb === 0 ? 1 : la, lb, g.who);
              g.el.setAttribute("cx", gx.toFixed(2));
              g.el.setAttribute("cy", gy.toFixed(2));
              // ghosts die as the rings lock — nothing trails a thing at rest
              const fade = st.b >= 1 ? 0 : 1;
              g.el.setAttribute("opacity", String(fade));
            });
          }
          render();

          // Phase A — fly in, decelerating into the near miss
          tl.to(st, { a: 1, duration: 0.9, ease: "power2.out", onUpdate: render }, 0.12);
          // Phase B — the pull: one clockwise turn, spiralling in, accelerating into the lock
          tl.to(st, { b: 1, duration: T_LOCK - 1.08, ease: "power2.in", onUpdate: render }, 1.08);
          // Impact → recoil → settle (causal chain, same frame as the lock)
          tl.fromTo(st, { sep: 0 }, { sep: 12, duration: 0.07, ease: "power2.out", onUpdate: render, immediateRender: false }, T_LOCK);
          tl.to(st, { sep: 0, duration: 0.5, ease: "back.out(2.2)", onUpdate: render }, T_LOCK + 0.07);
          const sqMe = svgT("#s1-ring-me-g", 415, 820);
          const sqYou = svgT("#s1-ring-you-g", 665, 820);
          [sqMe, sqYou].forEach((h) => {
            tl.fromTo(h.p, { sx: 1, sy: 1 }, { sx: 0.9, sy: 1.07, duration: 0.07, ease: "power2.out", onUpdate: h.apply, immediateRender: false }, T_LOCK);
            tl.to(h.p, { sx: 1, sy: 1, duration: 0.55, ease: "back.out(2.4)", onUpdate: h.apply }, T_LOCK + 0.07);
          });

          // The lens flashes in (spring pop) and a flash ring expands from it
          const lens = svgT("#s1-lens", 540, 820, 0);
          tl.fromTo(lens.p, { sx: 0, sy: 0 }, { sx: 1, sy: 1, duration: 0.42, ease: "back.out(2)", onUpdate: lens.apply, immediateRender: false }, T_LOCK);
          tl.fromTo("#s1-flash", { attr: { r: 60 }, strokeWidth: 8, opacity: 0 }, { attr: { r: 640 }, strokeWidth: 1, duration: 0.7, ease: "power3.out", immediateRender: false }, T_LOCK);
          tl.fromTo("#s1-flash", { opacity: 0.9 }, { opacity: 0, duration: 0.7, ease: "power1.in", immediateRender: false }, T_LOCK);
          gsap.set("#s1-flash", { opacity: 0 });

          // The shockwave runs through the field, ring by ring, outward
          field.forEach((c, i) => {
            tl.to(c, { strokeOpacity: 0.38, strokeWidth: 3, duration: 0.12, ease: "power2.out" }, T_LOCK + 0.04 + i * 0.045);
            tl.to(c, { strokeOpacity: 0.1, strokeWidth: 2, duration: 0.5, ease: "power2.in" }, T_LOCK + 0.16 + i * 0.045);
          });

          // Wordmark — waterfall entry: binary opacity, whip up from below, gaps shrinking
          const word = "Тандем";
          const wm = document.getElementById("s1-wordmark");
          [...word].forEach((ch) => {
            const s = document.createElement("span");
            s.className = "s1-ch";
            s.textContent = ch;
            wm.appendChild(s);
          });
          const chars = wm.querySelectorAll(".s1-ch");
          let at = 2.56;
          let gap = 0.05;
          chars.forEach((c, i) => {
            const heavy = i === 0;
            tl.set(c, { opacity: 1 }, at);
            tl.fromTo(c, { y: heavy ? 80 : 56 }, { y: 0, duration: heavy ? 0.2 : 0.15, ease: "power4.out", immediateRender: false }, at);
            at += gap;
            gap *= 0.84;
          });
          gsap.set(chars, { y: 80 });
          tl.fromTo("#s1-tagline", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.95);

          // Stillness 3.25 → 3.60, then the dive: push INTO the lens, mid-push at the cut
          tl.fromTo("#s1-world", { scale: 1, filter: "blur(0px)" }, { scale: 6, filter: "blur(18px)", duration: 0.334, ease: "power4.in", immediateRender: false }, 3.6);
          tl.to(["#s1-glow-rose", "#s1-glow-sky"], { opacity: 0, duration: 0.3, ease: "power2.in" }, 3.64);

          window.__timelines["s01-hook"] = tl;
        })();
      </script>
