          tl.to("#s09-env", { scaleY: 1, duration: 0.4, ease: "back.out(2.4)" }, SEAL + 0.05);
          // shockwave from the seal
          tl.fromTo("#s09-wave-a", { attr: { r: 78 }, opacity: 0.8 }, { attr: { r: 300 }, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, SEAL);
          tl.fromTo("#s09-wave-b", { attr: { r: 78 }, opacity: 0.6 }, { attr: { r: 230 }, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, SEAL + 0.08);

          // captions: the app's own sealed state
          tl.fromTo("#s09-sealed", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, SEAL + 0.08);
          tl.fromTo("#s09-sealed-body", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, SEAL + 0.2);

          // ── 2.95 → 3.5: the envelope flies up along an arc; a dotted trail stretches back
          // to the tag. Path = cubic bezier of the flyer's centre, authored constants; it bends
          // right of the headline so the shrinking envelope never crosses the words.
          const P = [[540, 1010], [620, 860], [860, 760], [880, 480]];
          const bez = (i, t) => {
            const u = 1 - t;
            return u * u * u * P[0][i] + 3 * u * u * t * P[1][i] + 3 * u * t * t * P[2][i] + t * t * t * P[3][i];
          };
          const trail = document.getElementById("s09-trail");
          const dots = [];
          const DOTS = 26;
          for (let k = 1; k <= DOTS; k++) {
            const t = 0.02 + (k / DOTS) * 0.94;
            const d = document.createElementNS(NS, "circle");
            d.setAttribute("cx", bez(0, t).toFixed(1));
            d.setAttribute("cy", bez(1, t).toFixed(1));
            d.setAttribute("r", "5");
            d.setAttribute("fill", "#6fd1cb");
            d.setAttribute("opacity", "0");
            trail.appendChild(d);
            dots.push({ el: d, t });
          }
          const flyer = document.getElementById("s09-flyer");
          const fly = { t: 0 };
          const drawFly = () => {
            const x = bez(0, fly.t) - P[0][0];
            const y = bez(1, fly.t) - P[0][1];
            const s = 1 - 0.7 * fly.t;
            const r = -9 * fly.t;
            flyer.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg) scale(${s.toFixed(4)})`;
            // dots light as the envelope passes them, and stay: the trail stretches behind it
            dots.forEach((d) => {
              d.el.setAttribute("opacity", fly.t >= d.t ? "0.85" : "0");
            });
          };
          drawFly();
          const FLY = 6 * B;
          tl.fromTo(fly, { t: 0 }, { t: 1, duration: 0.56, ease: "power2.inOut", onUpdate: drawFly, immediateRender: false }, FLY);
          // the tag appears where the letter was
          tl.fromTo("#s09-tag", { opacity: 0, scale: 0.6, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(2)" }, FLY + 0.06);

          window.__timelines["s09-letters"] = tl;
        })();
      </script>
    </template>
