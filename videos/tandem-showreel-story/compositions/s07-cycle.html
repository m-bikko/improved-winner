      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const NS = "http://www.w3.org/2000/svg";
          const B = 0.4918; // one beat
          const CX = 540;
          const CY = 884;
          const R = 240;
          const CIRC = 2 * Math.PI * R;
          const DAYS = 28;

          // Scale an SVG node around a FIXED point by writing its transform attribute.
          // Not GSAP svgOrigin: inside a montage this sub-composition is not laid out when the
          // timeline is built, and every origin came out shifted. Pure numbers, seek-safe.
          const svgT = (sel, cx, cy, s0 = 1) => {
            const node = typeof sel === "string" ? document.querySelector(sel) : sel;
            const p = { sx: s0, sy: s0 };
            const apply = () => node.setAttribute("transform", `translate(${cx} ${cy}) scale(${p.sx.toFixed(4)} ${p.sy.toFixed(4)}) translate(${-cx} ${-cy})`);
            apply();
            return { p, apply };
          };

          // ── Entrances: eyebrow, waterfall headline, ring settles, legend + privacy row rise
          tl.fromTo("#s07-eyebrow-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 0.04);
          tl.fromTo("#s07-eyebrow-text", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 0.06);
          const words = [];
          [["s07-h1", "Только если"], ["s07-h2", "она сама откроет"]].forEach(([id, text]) => {
            const host = document.getElementById(id);
            text.split(" ").forEach((w, i, arr) => {
              const s = document.createElement("span");
              s.className = "s07-w";
              s.textContent = w + (i < arr.length - 1 ? " " : "");
              host.appendChild(s);
              words.push(s);
            });
          });
          let at = 0.1;
          let gap = 0.07;
          words.forEach((w, i) => {
            tl.set(w, { opacity: 1 }, at);
            tl.fromTo(w, { y: i === 0 ? 76 : 50 }, { y: 0, duration: i === 0 ? 0.2 : 0.16, ease: "power4.out", immediateRender: false }, at);
            at += gap;
            gap *= 0.84;
          });
          gsap.set(words, { y: 76 });
          const ringT = svgT("#s07-ring-g", CX, CY, 0.86);
          tl.fromTo(ringT.p, { sx: 0.86, sy: 0.86 }, { sx: 1, sy: 1, duration: 0.5, ease: "power3.out", onUpdate: ringT.apply, immediateRender: false }, 0.02);
          tl.fromTo("#s07-ring-g", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power3.out" }, 0.02);
          tl.fromTo("#s07-center", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.16);
          tl.fromTo("#s07-card", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.22);

          // ── The «сегодня» marker: rides the ring at day d (0..28 clockwise from the top)
          const marker = document.getElementById("s07-marker");
          const num = document.getElementById("s07-num");
          const mk = { d: 0.5 };
          const drawMk = () => {
            const a = (mk.d / DAYS) * 2 * Math.PI - Math.PI / 2;
            marker.setAttribute("cx", (CX + R * Math.cos(a)).toFixed(2));
            marker.setAttribute("cy", (CY + R * Math.sin(a)).toFixed(2));
            num.textContent = `День ${Math.min(21, Math.max(1, Math.floor(mk.d) + 1))}`;
          };
          drawMk();
          tl.fromTo(marker, { attr: { r: 0 } }, { attr: { r: 17 }, duration: 0.4, ease: "back.out(2.2)" }, 0.26);

          // ── Four phases, one per beat: a stroke-drawn arc with a 1.6° gap + its legend pill
          const PHASES = [
            { from: 0, to: 5, color: "#e5768c", t: B, stop: 4.5 },
            { from: 5, to: 14, color: "#a0a8f2", t: 2 * B, stop: 13.5 },
            { from: 14, to: 17, color: "#80cf99", t: 3 * B, stop: 16.5 },
            { from: 17, to: 28, color: "#efb35e", t: 4 * B, stop: 20.5 },
          ];
          const GAP = (1.6 / 360) * CIRC;
          let prevStop = 0.5;
          PHASES.forEach((ph, i) => {
            const start = (ph.from / DAYS) * CIRC + GAP / 2;
            const drawn = ((ph.to - ph.from) / DAYS) * CIRC - GAP;
            const seg = document.createElementNS(NS, "circle");
            seg.setAttribute("cx", String(CX));
            seg.setAttribute("cy", String(CY));
            seg.setAttribute("r", String(R));
            seg.setAttribute("fill", "none");
            seg.setAttribute("stroke", ph.color);
            seg.setAttribute("stroke-width", "46");
            seg.setAttribute("stroke-linecap", "butt");
            // dash = [drawn, rest]; the offset rotates the dash to start at the phase's first day
            seg.setAttribute("stroke-dasharray", `0 ${CIRC.toFixed(2)}`);
            seg.setAttribute("stroke-dashoffset", (-start).toFixed(2));
            document.getElementById("s07-arcs").appendChild(seg);
            const d = { v: 0 };
            const dur = i === 3 ? 0.4 : 0.36;
            tl.fromTo(d, { v: 0 }, {
              v: drawn,
              duration: dur,
              ease: "power3.out",
              onUpdate: () => seg.setAttribute("stroke-dasharray", `${d.v.toFixed(2)} ${CIRC.toFixed(2)}`),
              immediateRender: false,
            }, ph.t);
            // the marker steps with the arc head (same start, same ease) and counts the day
            tl.fromTo(mk, { d: prevStop }, { d: ph.stop, duration: dur, ease: "power3.out", onUpdate: drawMk, immediateRender: false }, ph.t);
            prevStop = ph.stop;
