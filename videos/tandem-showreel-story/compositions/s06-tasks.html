          <filter data-hf-id="hf-a4c8" id="s06-noise"><feturbulence data-hf-id="hf-iz59" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="37" /><fecolormatrix data-hf-id="hf-skw8" type="saturate" values="0" /></filter>
          <rect data-hf-id="hf-flca" width="1080" height="1920" filter="url(#s06-noise)" />
        </svg>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const NS = "http://www.w3.org/2000/svg";
          const B = 0.4918; // one beat

          // ── Positions (constants — never measured)
          // checkbox centres: card left 108 + svg left 34 + 40 = 182; card top + 28 + 40
          const BOX = [[182, 716], [182, 874]];
          const SEAT_ME = [230, 1440];
          const SEAT_YOU = [850, 1440];
          // check path M27.2 40.8 L35.2 48.8 L52.8 31.2 — length by hand: 8√2 + 17.6√2
          const CHECK_LEN = Math.hypot(8, 8) + Math.hypot(17.6, 17.6); // 36.20

          // ── Entrances (camera push owns the first 0.5s: only rise-from-below and growth here)
          tl.fromTo("#s06-eyebrow-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 0.04);
          tl.fromTo("#s06-eyebrow-text", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 0.06);
          const words = [];
          [["s06-h1", "Со сроком"], ["s06-h2", "и напомнит обоим"]].forEach(([id, text]) => {
            const host = document.getElementById(id);
            text.split(" ").forEach((w, i, arr) => {
              const s = document.createElement("span");
              s.className = "s06-w";
              s.textContent = w + (i < arr.length - 1 ? " " : "");
              host.appendChild(s);
              words.push(s);
            });
          });
          let at = 0.1;
          let gap = 0.07;
          words.forEach((w, i) => {
            tl.set(w, { opacity: 1 }, at);
            tl.fromTo(w, { y: i === 0 ? 76 : 50 }, { y: 0, duration: i === 0 ? 0.2 : 0.16, ease: "power4.out", immediateRender: false }, at);
            at += gap;
            gap *= 0.84;
          });
          gsap.set(words, { y: 76 });
          tl.fromTo(".s06-card", { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.07 }, 0.08);

          // ── The two ring-cursors: group transform written from proxies (no svgOrigin)
          const cursor = (id, seat) => {
            const g = document.getElementById(id);
            const pos = { x: seat[0], y: seat[1] };
            const sc = { s: 0 };
            const draw = () => g.setAttribute("transform", `translate(${pos.x.toFixed(2)} ${pos.y.toFixed(2)}) scale(${sc.s.toFixed(4)})`);
            draw();
            return { pos, sc, draw };
          };
          const ME = cursor("s06-me", SEAT_ME);
          const YOU = cursor("s06-you", SEAT_YOU);
          tl.fromTo(ME.sc, { s: 0 }, { s: 1, duration: 0.42, ease: "back.out(1.8)", onUpdate: ME.draw, immediateRender: false }, 0.16);
          tl.fromTo(YOU.sc, { s: 0 }, { s: 1, duration: 0.42, ease: "back.out(1.8)", onUpdate: YOU.draw, immediateRender: false }, 0.24);

          // x and y on different eases → a gentle arc instead of a ruler line
          const travel = (C, from, to, t, d) => {
            tl.fromTo(C.pos, { x: from[0] }, { x: to[0], duration: d, ease: "power2.inOut", onUpdate: C.draw, immediateRender: false }, t);
            tl.fromTo(C.pos, { y: from[1] }, { y: to[1], duration: d, ease: "power3.inOut", onUpdate: C.draw, immediateRender: false }, t);
          };
          // press-release-spring on the ring itself: linear-ish squash into the beat, spring out
          const press = (C, t) => {
            tl.fromTo(C.sc, { s: 1 }, { s: 0.78, duration: 0.07, ease: "power2.in", onUpdate: C.draw, immediateRender: false }, t - 0.07);
            tl.fromTo(C.sc, { s: 0.78 }, { s: 1, duration: 0.34, ease: "back.out(2.4)", onUpdate: C.draw, immediateRender: false }, t);
          };
          const ripple = (host, cx, cy, color, t0, r0, r1, n) => {
            for (let k = 0; k < n; k++) {
              const c = document.createElementNS(NS, "circle");
              c.setAttribute("cx", String(cx));
              c.setAttribute("cy", String(cy));
              c.setAttribute("r", String(r0));
              c.setAttribute("fill", "none");
              c.setAttribute("stroke", color);
              c.setAttribute("stroke-width", "5");
              c.setAttribute("opacity", "0");
              document.getElementById(host).appendChild(c);
              tl.fromTo(c, { attr: { r: r0 }, opacity: 0.7 }, { attr: { r: r1 }, opacity: 0, duration: 0.75, ease: "power2.out", immediateRender: false }, t0 + k * 0.1);
            }
          };

          // a task gets done: fill pops, the check stroke-draws, title strikes, due → doer
          const done = (i, t, color) => {
            tl.fromTo(`#s06-cf-${i}`, { attr: { r: 0 } }, { attr: { r: 35 }, duration: 0.32, ease: "back.out(2)" }, t);
            const ck = document.getElementById(`s06-ck-${i}`);
            const dash = { v: CHECK_LEN };
            const drawCk = () => {
              ck.setAttribute("stroke-dasharray", `${CHECK_LEN.toFixed(2)} ${CHECK_LEN.toFixed(2)}`);
              ck.setAttribute("stroke-dashoffset", dash.v.toFixed(2));
              ck.setAttribute("opacity", dash.v < CHECK_LEN - 0.01 ? "1" : "0");
            };
            drawCk();
            tl.fromTo(dash, { v: CHECK_LEN }, { v: 0, duration: 0.3, ease: "power2.out", onUpdate: drawCk, immediateRender: false }, t + 0.05);
            ripple("s06-press-ripples", BOX[i][0], BOX[i][1], color, t, 40, 150, 2);
            tl.fromTo(`#s06-st-${i}`, { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "power3.out" }, t + 0.08);
            tl.fromTo(`#s06-t-${i}`, { color: "#f3efe9" }, { color: "#a39b92", duration: 0.3, ease: "power2.out" }, t + 0.08);
            tl.fromTo(`#s06-due-${i}`, { opacity: 1, y: 0 }, { opacity: 0, y: -14, duration: 0.2, ease: "power2.in", immediateRender: false }, t + 0.14);
            tl.fromTo(`#s06-doer-${i}`, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, t + 0.3);
          };

          // ── «я» ticks the first task on 0.98
          const T1 = 2 * B;
          travel(ME, SEAT_ME, BOX[0], 0.5, T1 - 0.07 - 0.5);
          press(ME, T1);
          done(0, T1, "#f28ca2");
          travel(ME, BOX[0], SEAT_ME, T1 + 0.06, 0.4);

          // ── «ты» ticks the second on the downbeat 1.97, then glides home (stillness follows)
          const T2 = 4 * B;
          travel(YOU, SEAT_YOU, BOX[1], 3 * B - 0.02, T2 - 0.07 - (3 * B - 0.02));
          press(YOU, T2);
          done(1, T2, "#84b9ef");
          travel(YOU, BOX[1], SEAT_YOU, T2 + 0.05, 0.32);

          // ── 2.46: the push lands; the bell rings once; the task it is about lights up
          const N = 5 * B;
          tl.fromTo("#s06-note", { opacity: 0, y: 70, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, N);
          tl.fromTo("#s06-bell-wrap", { rotation: 0 }, { rotation: -24, duration: 0.09, ease: "power2.out" }, N + 0.1);
          tl.fromTo("#s06-bell-wrap", { rotation: -24 }, { rotation: 18, duration: 0.12, ease: "power2.inOut", immediateRender: false }, N + 0.19);
          tl.fromTo("#s06-bell-wrap", { rotation: 18 }, { rotation: -9, duration: 0.12, ease: "power2.inOut", immediateRender: false }, N + 0.31);
          tl.fromTo("#s06-bell-wrap", { rotation: -9 }, { rotation: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, N + 0.43);
          ripple("s06-bell-ripples", 184, 1238, "#84b9ef", N + 0.1, 60, 260, 3);
          tl.fromTo("#s06-card-2", { boxShadow: "inset 0 0 0 2px rgba(255, 255, 255, 0.06)" }, { boxShadow: "inset 0 0 0 3px rgba(132, 185, 239, 0.75)", duration: 0.3, ease: "power2.out", immediateRender: false }, N + 0.1);
          tl.fromTo("#s06-c2-bell", { color: "#a39b92" }, { color: "#84b9ef", duration: 0.3, ease: "power2.out" }, N + 0.1);

          // ── …to BOTH: the push splits into two dotted trails (a Y), each lead dot lands in
          // its ring exactly on 2.95; the dots behind it light as it passes and fade out
          const A = 6 * B;
          const START = [540, 1318];
          const TRAILS = [
            { ctrl: [470, 1446], end: SEAT_ME, color: "#f28ca2" },
            { ctrl: [610, 1446], end: SEAT_YOU, color: "#84b9ef" },
          ];
          const bez = (tr, e) => {
            const v = 1 - e;
            return [
              v * v * START[0] + 2 * v * e * tr.ctrl[0] + e * e * tr.end[0],
              v * v * START[1] + 2 * v * e * tr.ctrl[1] + e * e * tr.end[1],
            ];
          };
          const TRAIL_N = 14;
          const trail = [];
          const heads = [];
          TRAILS.forEach((tr) => {
            for (let k = 1; k < TRAIL_N; k++) {
              const p = k / TRAIL_N;
              const [x, y] = bez(tr, p);
              const d = document.createElementNS(NS, "circle");
              d.setAttribute("cx", x.toFixed(1));
              d.setAttribute("cy", y.toFixed(1));
              d.setAttribute("r", "5");
              d.setAttribute("fill", tr.color);
              d.setAttribute("opacity", "0");
              document.getElementById("s06-dots").appendChild(d);
              trail.push({ el: d, p });
            }
            const h = document.createElementNS(NS, "circle");
            h.setAttribute("r", "13");
            h.setAttribute("fill", tr.color);
            h.setAttribute("opacity", "0");
            document.getElementById("s06-dots").appendChild(h);
            heads.push({ el: h, tr });
          });
          // clock c: 0 → 1 is the lead dot's flight, 1 → 1.5 lets the trail fade out
          const fly = { c: 0 };
          const drawDots = () => {
            const u = Math.min(fly.c, 1);
            const hp = u < 0.5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u);
            const tail = Math.max(0, fly.c - 1);
            heads.forEach(({ el, tr }) => {
              const on = fly.c > 0.001 && fly.c < 0.999;
              const [x, y] = bez(tr, hp);
              el.setAttribute("cx", x.toFixed(2));
              el.setAttribute("cy", y.toFixed(2));
              el.setAttribute("opacity", on ? "1" : "0");
            });
            trail.forEach(({ el, p }) => {
              const lit = fly.c > 0.001 && hp >= p ? Math.max(0, 1 - (hp - p + tail) * 2.4) : 0;
              el.setAttribute("opacity", lit.toFixed(3));
            });
          };
          drawDots();
          const FLY0 = N + 0.17;
          const FLY_END = 1.5;
          // linear clock: c reaches 1 (the lead dot in the ring) exactly on 2.95
          tl.fromTo(fly, { c: 0 }, { c: FLY_END, duration: (A - FLY0) * FLY_END, ease: "none", onUpdate: drawDots, immediateRender: false }, FLY0);

          [ME, YOU].forEach((C) => {
            tl.fromTo(C.sc, { s: 1 }, { s: 1.26, duration: 0.08, ease: "power2.out", onUpdate: C.draw, immediateRender: false }, A);
            tl.fromTo(C.sc, { s: 1.26 }, { s: 1, duration: 0.5, ease: "back.out(2.4)", onUpdate: C.draw, immediateRender: false }, A + 0.08);
          });
          ripple("s06-seat-ripples", SEAT_ME[0], SEAT_ME[1], "#f28ca2", A, 44, 170, 2);
          ripple("s06-seat-ripples", SEAT_YOU[0], SEAT_YOU[1], "#84b9ef", A, 44, 170, 2);

          window.__timelines["s06-tasks"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
