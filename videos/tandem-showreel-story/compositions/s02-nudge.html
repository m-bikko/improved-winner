        (function () {
          const tl = gsap.timeline({ paused: true });

          const B = 0.4918; // one beat

          // Scale an SVG node around a FIXED point by writing its transform attribute.
          // Not GSAP svgOrigin: that needs the node's bbox, and inside a montage this
          // sub-composition is not laid out yet when the timeline is built — every origin
          // came out shifted. Pure numbers, seek-safe.
          const svgT = (sel, cx, cy, s0 = 1) => {
            const node = typeof sel === "string" ? document.querySelector(sel) : sel;
            const p = { sx: s0, sy: s0 };
            const apply = () => node.setAttribute("transform", `translate(${cx} ${cy}) scale(${p.sx.toFixed(4)} ${p.sy.toFixed(4)}) translate(${-cx} ${-cy})`);
            apply();
            return { p, apply };
          };

          // ── Iris: the s1 lens keeps growing (Z-push continues), then dissolves
          // velocity-matched to s1's push: s1 ends at ds/dt = 5·4/0.334 ≈ 60/s (power4.in);
          // power2.out starts at 2·Δ/D = 2·12/0.40 = 60/s — one continuous move across the cut
          tl.fromTo("#s2-iris", { scale: 6, opacity: 1 }, { scale: 18, duration: 0.4, ease: "power2.out" }, 0);
          tl.to("#s2-iris", { opacity: 0, duration: 0.3, ease: "power1.in" }, 0);

          // ── Headline: waterfall entry, word by word (binary opacity, from below)
          const h1 = document.getElementById("s2-h1");
          const h2 = document.getElementById("s2-h2");
          const addWords = (host, text) =>
            text.split(" ").map((w, i, arr) => {
              const s = document.createElement("span");
              s.className = "s2-w";
              s.textContent = w + (i < arr.length - 1 ? " " : "");
              host.appendChild(s);
              return s;
            });
          const words = [...addWords(h1, "Одно касание"), ...addWords(h2, "и вы ближе")];
          let at = 0.14;
          let gap = 0.07;
          words.forEach((w, i) => {
            tl.set(w, { opacity: 1 }, at);
            tl.fromTo(w, { y: i === 0 ? 76 : 50 }, { y: 0, duration: i === 0 ? 0.2 : 0.16, ease: "power4.out", immediateRender: false }, at);
            at += gap;
            gap *= 0.84;
          });

          //    end, clear of the label: the words on the button must stay readable during the press
          const meState = { x: 240, y: 1400 };
          const meEl = document.getElementById("s2-me");
          const meLabel = document.getElementById("s2-me-label");
          const drawMe = () => {
            meEl.setAttribute("cx", meState.x.toFixed(2));
            meEl.setAttribute("cy", meState.y.toFixed(2));
            meLabel.style.transform = `translate(${(meState.x - 240).toFixed(2)}px, ${(meState.y - 1400).toFixed(2)}px)`;
          };
          drawMe();
          tl.to(meState, { x: 240, y: 1120, duration: 0.34, ease: "power3.inOut", onUpdate: drawMe }, 0.13);
          const PRESS = B; // 0.492
          // the press squashes the ring itself (its radius), wherever it happens to be

          // press-release-spring on the button: linear compression, spring recovery
          tl.to("#s2-button", { scale: 0.94, duration: 0.07, ease: "none" }, PRESS - 0.05);
          tl.to("#s2-button", { scale: 1, duration: 0.5, ease: "back.out(2.6)" }, PRESS + 0.02);

              c.setAttribute("cy", String(cy));
              c.setAttribute("r", "40");
              c.setAttribute("fill", "none");
              c.setAttribute("stroke", color);
              c.setAttribute("stroke-width", "6");
              c.setAttribute("opacity", "0");
              document.getElementById(host).appendChild(c);

          };

          const fly = { t: 0 };
          const drawHeart = () => {
            // visible only while in flight: a pure function of progress, seek-safe both ways
            fly.on = fly.t > 0.001 && fly.t < 0.999 ? 1 : 0;
            const x = bez(0, fly.t);
            const y = bez(1, fly.t);
            const s = 3.2 * (1 + 0.35 * Math.sin(Math.PI * fly.t));
            heartG.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${s.toFixed(3)})`);
            heartG.setAttribute("opacity", String(fly.on));
            dots.forEach((d) => {
              const lit = fly.on > 0 && d.t <= fly.t ? Math.max(0, 1 - (fly.t - d.t) * 1.6) : 0;
              d.el.setAttribute("opacity", lit.toFixed(3));
            });
            parts.forEach((p, k) => {
              const a = fly.t * Math.PI * 5 + (k * Math.PI) / 3;
              const r = 58 + 10 * Math.sin(fly.t * Math.PI * 3 + k);
              p.setAttribute("cx", (x + r * Math.cos(a)).toFixed(2));
              p.setAttribute("cy", (y + r * Math.sin(a)).toFixed(2));
              p.setAttribute("opacity", (fly.on * (1 - fly.t * 0.6)).toFixed(3));
            });
          };
          drawHeart();
          tl.fromTo(fly, { t: 0 }, { t: 1, duration: 4 * B - PRESS - 0.06, ease: "power2.inOut", onUpdate: drawHeart, immediateRender: false }, PRESS + 0.06);

          // ── Arrival ON the downbeat (1.967): «ты» pulses, ripples, the notification lands
          const ARRIVE = 4 * B;
          tl.fromTo(youT.p, { sx: 1, sy: 1 }, { sx: 1.24, sy: 1.24, duration: 0.08, ease: "power2.out", onUpdate: youT.apply, immediateRender: false }, ARRIVE);
          tl.to(youT.p, { sx: 1, sy: 1, duration: 0.55, ease: "back.out(2.4)", onUpdate: youT.apply }, ARRIVE + 0.08);
          tl.fromTo("#s2-you-label", { scale: 1 }, { scale: 1.24, duration: 0.08, ease: "power2.out", immediateRender: false }, ARRIVE);
          tl.to("#s2-you-label", { scale: 1, duration: 0.55, ease: "back.out(2.4)" }, ARRIVE + 0.08);
          ripple("s2-ripples-you", 840, 800, "#84b9ef", ARRIVE);
          tl.fromTo("#s2-note", { opacity: 0, scale: 0.6, x: 60 }, { opacity: 1, scale: 1, x: 0, duration: 0.5, ease: "back.out(1.6)" }, ARRIVE + 0.04);

          // ── The button reports the app's cooling state (sequenced UI life), on the beat
          const COOL = 5 * B;
          tl.to("#s2-button", { backgroundColor: "#28241f", boxShadow: "0 30px 70px -30px rgba(229, 118, 140, 0)", duration: 0.3, ease: "power2.out" }, COOL);
          tl.to("#s2-btn-on", { y: -60, opacity: 0, duration: 0.24, ease: "power3.in" }, COOL);
          tl.fromTo("#s2-btn-off", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.38, ease: "power3.out" }, COOL + 0.12);

          window.__timelines["s02-nudge"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
