              <span data-hf-id="hf-18ga" class="s08-who" data-layout-allow-overlap="" style="color: #f28ca2">я</span>
            </div>
          </div>
        </div>

        <svg data-hf-id="hf-7oob" id="s08-grain" width="1080" height="1920">
          <filter data-hf-id="hf-0gne" id="s08-noise"><feturbulence data-hf-id="hf-iz59" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="37" /><fecolormatrix data-hf-id="hf-skw8" type="saturate" values="0" /></filter>
          <rect data-hf-id="hf-4618" width="1080" height="1920" filter="url(#s08-noise)" />
        </svg>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const B = 0.4918; // one beat

          // ── Eyebrow + headline: waterfall entry (binary opacity, whip up from below)
          tl.fromTo("#s08-eyebrow", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, 0.02);
          const words = [];
          [["s08-h1", "Хочу"], ["s08-h2", "и ты узнаешь"]].forEach(([id, text]) => {
            const host = document.getElementById(id);
            text.split(" ").forEach((w, i, arr) => {
              const s = document.createElement("span");
              s.className = "s08-w";
              s.textContent = w;
              host.appendChild(s);
              // the space lives outside the inline-block: a trailing space inside one collapses
              if (i < arr.length - 1) host.appendChild(document.createTextNode(" "));
              words.push(s);
            });
          });
          let at = 0.06;
          let gap = 0.08;
          words.forEach((w, i) => {
            tl.set(w, { opacity: 1 }, at);
            tl.fromTo(w, { y: i === 0 ? 80 : 54 }, { y: 0, duration: i === 0 ? 0.22 : 0.17, ease: "power4.out", immediateRender: false }, at);
            at += gap;
            gap *= 0.84;
          });
          gsap.set(words, { y: 80 });

          // ── The ribbon rises in with the headline
          tl.fromTo("#s08-ribbon", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.14);

          // ── Chip selection: one owner per chip colour at a time (fromTo, explicit states)
          const ON = { backgroundColor: "#e5768c", color: "#1c1a17" };
          const OFF = { backgroundColor: "#1c1a18", color: "#f3efe9" };
          const flip = (sel, from, to, t) =>
            tl.fromTo(sel, { ...from }, { ...to, duration: 0.14, ease: "power2.out", immediateRender: false }, t);
          // «Все» starts selected (the app's default), hands over on the first deal
          flip("#s08-chip-all", ON, OFF, B - 0.03);
          flip("#s08-chip-visit", OFF, ON, B - 0.03);
          flip("#s08-chip-visit", ON, OFF, 2 * B - 0.03);
          flip("#s08-chip-buy", OFF, ON, 2 * B - 0.03);
          flip("#s08-chip-buy", ON, OFF, 3 * B - 0.03);
          flip("#s08-chip-together", OFF, ON, 3 * B - 0.03);
          flip("#s08-chip-together", ON, OFF, 5 * B - 0.03);
          flip("#s08-chip-all", OFF, ON, 5 * B - 0.03);

          // ribbon scrolls so «Сделать вместе» is in view for the third deal, then home for «Все»
          tl.fromTo("#s08-ribbon", { x: 0 }, { x: -820, duration: 0.36, ease: "power3.inOut", immediateRender: false }, 3 * B - 0.38);
          tl.fromTo("#s08-ribbon", { x: -820 }, { x: 0, duration: 0.42, ease: "power3.out", immediateRender: false }, 5 * B - 0.1);

          // counts: discrete, stacked digits toggled by sets (seek-safe both ways)
          tl.set("#s08-visit-1", { opacity: 1 }, B);
          tl.set("#s08-buy-1", { opacity: 1 }, 2 * B);
          tl.set("#s08-together-1", { opacity: 1 }, 3 * B);
          tl.set("#s08-all-1", { opacity: 1 }, B);
          tl.set("#s08-all-1", { opacity: 0 }, 2 * B);
          tl.set("#s08-all-2", { opacity: 1 }, 2 * B);
          tl.set("#s08-all-2", { opacity: 0 }, 3 * B);
          tl.set("#s08-all-3", { opacity: 1 }, 3 * B);
          // the «3» answers the climax
          tl.fromTo("#s08-all-3", { scale: 1 }, { scale: 1.5, duration: 0.08, ease: "power2.out", immediateRender: false }, 5 * B + 0.06);
          tl.to("#s08-all-3", { scale: 1, duration: 0.42, ease: "back.out(2.4)" }, 5 * B + 0.14);

          // ── Deal: each wish flies up from below the frame and lands on the pile ON the beat.
          // Cards are laid out at their final list slots; PILE is the inverted offset (FLIP).
          const PILE = [
            { x: -24, y: 226, r: -5.5 },
            { x: 22, y: -2, r: 3.8 },
            { x: 0, y: -224, r: -1.2 },
          ];
          const LAND = [B, 2 * B, 3 * B];
          PILE.forEach((p, i) => {
            const card = `#s08-c${i}`;
            const side = i % 2 ? 1 : -1;
            const t0 = LAND[i] - 0.2;
            tl.set(card, { opacity: 1 }, t0);
            tl.fromTo(
              card,
              { x: p.x + side * 210, y: p.y + 1000, rotation: p.r + side * 16 },
              { x: p.x, y: p.y, rotation: p.r, duration: 0.6, ease: "power4.out", immediateRender: false },
              t0,
            );
            gsap.set(card, { x: p.x + side * 210, y: p.y + 1000, rotation: p.r + side * 16 });
            // the tile answers the landing
            tl.fromTo(`${card} .s08-tile`, { scale: 0.6 }, { scale: 1, duration: 0.45, ease: "back.out(2.2)", immediateRender: false }, LAND[i] - 0.04);
          });
          gsap.set(".s08-tile", { scale: 0.6 });

          // ── Stillness ~1.95 → 2.40, then the climax ON 2.46: the pile spreads into the list
          const SPREAD = 5 * B;
          [1, 0, 2].forEach((i, k) => {
            const p = PILE[i];
            tl.fromTo(
              `#s08-c${i}`,
              { x: p.x, y: p.y, rotation: p.r },
              { x: 0, y: 0, rotation: 0, duration: 0.56, ease: "back.out(1.35)", immediateRender: false },
              SPREAD - 0.05 + k * 0.035,
            );
          });

          // ── 2.95: each author ring answers, top to bottom
          [0, 1, 2].forEach((i) => {
            const t = 6 * B + i * 0.07;
            tl.fromTo(`#s08-r${i}`, { attr: { r: 10 } }, { attr: { r: 14 }, duration: 0.08, ease: "power2.out", immediateRender: false }, t);
            tl.to(`#s08-r${i}`, { attr: { r: 10 }, duration: 0.4, ease: "back.out(2.6)" }, t + 0.08);
          });

          window.__timelines["s08-wishlist"] = tl;
        })();
      </script>
    </template>
